<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favSteam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D86540" />
      <stop offset="100%" stop-color="#E59A2A" />
    </linearGradient>
  </defs>
  <!-- Off-white background rounded square -->
  <rect width="128" height="128" rx="28" fill="#F8F6F0" />
  
  <g transform="translate(0, 4)">
    <!-- Arch Frame -->
    <path d="M 32,84 L 32,46 A 32,32 0 0,1 96,46 L 96,84 Z" fill="#F0EBE0" stroke="#162032" stroke-width="5" stroke-linejoin="round" />
    <line x1="24" y1="84" x2="104" y2="84" stroke="#162032" stroke-width="5" stroke-linecap="round" />

    <!-- Crescent Moon -->
    <path d="M 82,16 A 8,8 0 1,1 70,24 A 9,9 0 1,0 82,16 Z" fill="#E59A2A" />

    <!-- Steam -->
    <path d="M 64,62 C 58,50 72,42 66,28 C 64,24 61,21 58,18" fill="none" stroke="url(#favSteam)" stroke-width="4" stroke-linecap="round" />

    <!-- Tagine Cone -->
    <path d="M 38,72 L 64,52 L 90,72 Z" fill="#D86540" stroke="#162032" stroke-width="3" stroke-linejoin="round" />
    <circle cx="64" cy="51" r="4" fill="#162032" />

    <!-- Tagine Bowl Base -->
    <path d="M 36,72 L 40,82 C 40,82 46,84 64,84 C 82,84 88,82 88,82 L 92,72 Z" fill="#162032" />
    <path d="M 42,75 L 46,80 L 50,75 L 54,80 L 58,75 L 62,80 L 66,75 L 70,80 L 74,75 L 78,80 L 82,75 L 86,80" fill="none" stroke="#D86540" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
