<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D86540" />
      <stop offset="50%" stop-color="#E59A2A" />
      <stop offset="100%" stop-color="#F3C34D" />
    </linearGradient>
    <linearGradient id="tagineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2724D" />
      <stop offset="100%" stop-color="#BF4D2A" />
    </linearGradient>
    <pattern id="islamicPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20,0 L 40,20 L 20,40 L 0,20 Z" fill="none" stroke="#D8C5A4" stroke-width="0.8" opacity="0.45" />
      <path d="M 0,0 L 40,40 M 40,0 L 0,40" fill="none" stroke="#D8C5A4" stroke-width="0.6" opacity="0.35" />
      <circle cx="20" cy="20" r="4" fill="none" stroke="#D8C5A4" stroke-width="0.8" opacity="0.4" />
    </pattern>
    <style>
      .brand-title { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; fill: #162032; font-size: 72px; }
      .arabic-title { font-family: 'Cairo', 'Tajawal', 'Almarai', sans-serif; font-weight: 800; fill: #162032; font-size: 78px; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: #162032; font-size: 19px; letter-spacing: 5px; }
      .tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; fill: #526078; font-size: 15px; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Background Canvas (Off-white / Warm Cream) -->
  <rect width="800" height="800" rx="32" fill="#F8F6F0" />

  <!-- MAIN ARCH CONTAINER -->
  <g transform="translate(0, -10)">
    <!-- Arch Background with Islamic Pattern -->
    <path d="M 240,440 L 240,240 A 160,160 0 0,1 560,240 L 560,440 Z" fill="#F3EFE6" stroke="none" />
    <path d="M 240,440 L 240,240 A 160,160 0 0,1 560,240 L 560,440 Z" fill="url(#islamicPattern)" />

    <!-- Arch Frame Outer Border -->
    <path d="M 230,445 L 230,240 A 170,170 0 0,1 570,240 L 570,445" fill="none" stroke="#162032" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arch Base Line -->
    <line x1="210" y1="445" x2="590" y2="445" stroke="#162032" stroke-width="12" stroke-linecap="round" />
    <line x1="280" y1="460" x2="520" y2="460" stroke="#162032" stroke-width="8" stroke-linecap="round" />

    <!-- Sparkle Star inside Arch -->
    <path d="M 350,220 Q 350,232 362,232 Q 350,232 350,244 Q 350,232 338,232 Q 350,232 350,220 Z" fill="#E59A2A" />

    <!-- Rising Steam & Crescent Moon -->
    <!-- Crescent Moon at Top -->
    <path d="M 520,110 A 38,38 0 1,1 460,155 A 44,44 0 1,0 520,110 Z" fill="#E59A2A" transform="rotate(-15, 490, 130)" />
    
    <!-- Steam Curves -->
    <path d="M 428,340 C 410,290 470,250 445,190 C 438,172 425,160 415,145" fill="none" stroke="url(#steamGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 452,340 C 475,285 430,240 475,170 C 488,150 500,135 495,120" fill="none" stroke="url(#steamGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85" />

    <!-- TAGINE / CLAY COOKING DISH -->
    <!-- Lid Cone -->
    <path d="M 260,380 L 440,285 L 620,380 Z" fill="url(#tagineGrad)" stroke="#162032" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Knob on Top of Lid -->
    <ellipse cx="440" cy="280" rx="18" ry="14" fill="#162032" />

    <!-- Lid Trim Accent -->
    <path d="M 275,380 L 440,295 L 605,380" fill="none" stroke="#E59A2A" stroke-width="3" opacity="0.6" />

    <!-- Base Bowl -->
    <path d="M 250,380 L 280,430 C 280,430 310,440 440,440 C 570,440 600,430 600,430 L 630,380 Z" fill="#162032" stroke="#162032" stroke-width="4" stroke-linejoin="round" />

    <!-- Zigzag Decor on Base Bowl -->
    <path d="M 265,395 L 280,415 L 295,395 L 310,415 L 325,395 L 340,415 L 355,395 L 370,415 L 385,395 L 400,415 L 415,395 L 430,415 L 440,395 L 450,415 L 465,395 L 480,415 L 495,395 L 510,415 L 525,395 L 540,415 L 555,395 L 570,415 L 585,395 L 600,415 L 615,395" fill="none" stroke="#D86540" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Gold dots in triangles -->
    <circle cx="280" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="310" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="340" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="370" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="400" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="430" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="465" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="495" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="525" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="555" cy="402" r="2.5" fill="#E59A2A" />
    <circle cx="585" cy="402" r="2.5" fill="#E59A2A" />
  </g>

  <!-- BRAND NAME TYPOGRAPHY SECTION -->
  <g transform="translate(400, 560)" text-anchor="middle">
    <!-- English Name "wajba" -->
    <text x="-120" y="0" class="brand-title" text-anchor="end">wajba</text>
    
    <!-- Terracotta Dot -->
    <circle cx="-60" cy="-22" r="10" fill="#D86540" />

    <!-- Arabic Name "وجبة" -->
    <text x="0" y="5" class="arabic-title" text-anchor="start">وجبة</text>

    <!-- Star Ornament Divider Line -->
    <line x1="-220" y1="50" x2="-25" y2="50" stroke="#D8C5A4" stroke-width="1.5" />
    <!-- Center Star Ornament -->
    <g transform="translate(0, 50)">
      <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="#E59A2A" stroke-width="2" transform="rotate(45)" />
      <circle cx="0" cy="0" r="2.5" fill="#E59A2A" />
    </g>
    <line x1="25" y1="50" x2="220" y2="50" stroke="#D8C5A4" stroke-width="1.5" />

    <!-- Subtitle -->
    <text x="0" y="90" class="subtitle">MIDDLE EASTERN CULINARY ARCHITECTURE</text>

    <!-- Tagline -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" class="tagline">❖  choose the weekly/monthly meals for your family  ❖</text>
    </g>
  </g>
</svg>
